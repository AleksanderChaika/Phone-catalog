name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts skips "postinstall" (cypress verify and
      # mate-scripts update): the Cypress binary is not needed here and
      # the update script rewrites project files
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint scripts
        run: npm run lint-js

      - name: Lint styles
        run: npm run lint-css

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      # The site is served from /Phone-catalog/, so absolute /assets paths
      # would 404 there ("homepage" in package.json sets the Vite base)
      - name: Check that the build uses relative asset paths
        run: |
          if grep -nE '(src|href)="/assets' dist/index.html; then
            echo "::error file=dist/index.html::Absolute /assets paths found; check \"homepage\" in package.json"
            exit 1
          fi
